# feedbacks.sent-tech.ca — remote comments of the dev-mtl keynote deck (draft, NOT applied).
# Design: review/REMOTE.md in rhanka/dev-mtl-keynote-2026.
#   - Node/TS service (Hono), bundled into one file (ConfigMap keynote-feedbacks-code), run by the official Node image
#     pinned by digest (index sha256:8094c002…2a00, node:22.22.1-alpine3.23). No server code beyond that file.
#   - Sign-in at auth.sent-tech.ca (OIDC authorization_code + PKCE, PUBLIC client `keynote-feedbacks`): the service
#     holds NO secret for it. Its own session is an HttpOnly, SameSite=Lax, host-only cookie on feedbacks.sent-tech.ca.
#   - Storage: one SQLite file on a 1Gi volume; optional snapshots to S3 when the Secret keynote-feedbacks-s3 exists
#     (keys S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY — names only, values never in git).
#   - One replica, Recreate: a single process owns the SQLite file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keynote-feedbacks
  labels: { app.kubernetes.io/name: keynote-feedbacks }
data:
  NODE_ENV: "production"
  NODE_OPTIONS: "--dns-result-order=ipv4first --disable-warning=ExperimentalWarning"
  PORT: "8080"
  PUBLIC_URL: "https://feedbacks.sent-tech.ca"
  SITE_URL: "https://dev-mtl-keynote-2026.sent-tech.ca/"
  # Origins allowed to call /api with the session cookie (strict CORS allowlist; nothing else, no wildcard).
  SITE_ORIGINS: "https://dev-mtl-keynote-2026.sent-tech.ca"
  OIDC_ISSUER: "https://auth.sent-tech.ca"
  OIDC_CLIENT_ID: "keynote-feedbacks"
  TENANT_ID: "sent-tech"
  WORKSPACE_ID: "dev-mtl-keynote-2026"
  DATA_DIR: "/data"
  SESSION_TTL_HOURS: "168"
  WRITES_PER_MINUTE: "30"
  # Verified e-mails (comma-separated) that may edit / delete any comment. Left empty here (public repo): the real
  # value comes from the optional Secret keynote-feedbacks-admin (key ADMIN_EMAILS), which overrides this key.
  ADMIN_EMAILS: ""
  S3_PREFIX: "keynote-feedbacks"
  SNAPSHOT_MINUTES: "15"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keynote-feedbacks-data
  labels: { app.kubernetes.io/name: keynote-feedbacks }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: block-standard
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keynote-feedbacks
  labels: { app.kubernetes.io/name: keynote-feedbacks }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: keynote-feedbacks } }
  template:
    metadata: { labels: { app.kubernetes.io/name: keynote-feedbacks } }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: comments
          image: node:22.22.1-alpine3.23@sha256:8094c002d08262dba12645a3b4a15cd6cd627d30bc782f53229a2ec13ee22a00
          command: ["node", "/app/server.mjs"]
          envFrom:
            - configMapRef: { name: keynote-feedbacks }
            - secretRef: { name: keynote-feedbacks-s3, optional: true }
            # Moderators (owner decision 2026-11-24: the owner only), kept out of git. Listed last: it wins over the ConfigMap.
            - secretRef: { name: keynote-feedbacks-admin, optional: true }
          ports: [ { name: http, containerPort: 8080 } ]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 2, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: code
          configMap: { name: keynote-feedbacks-code }
        - name: data
          persistentVolumeClaim: { claimName: keynote-feedbacks-data }
---
apiVersion: v1
kind: Service
metadata:
  name: keynote-feedbacks
  labels: { app.kubernetes.io/name: keynote-feedbacks }
spec:
  selector: { app.kubernetes.io/name: keynote-feedbacks }
  ports: [ { name: http, port: 80, targetPort: http } ]
---
# The tenant baseline is default-deny-ingress: admit the cluster Traefik (namespace `traefik`) to the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-keynote-feedbacks
  labels: { app.kubernetes.io/name: keynote-feedbacks }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: keynote-feedbacks } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
      ports: [ { protocol: TCP, port: 8080 } ]
---
# TLS by cert-manager (ClusterIssuer letsencrypt-prod, DNS-01). DNS gate: an A record feedbacks.sent-tech.ca must
# point at the Traefik LoadBalancer public IP (the address auth.sent-tech.ca and pages.sent-tech.ca resolve to).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keynote-feedbacks
  labels: { app.kubernetes.io/name: keynote-feedbacks }
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - feedbacks.sent-tech.ca
      secretName: keynote-feedbacks-tls
  rules:
    - host: feedbacks.sent-tech.ca
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: keynote-feedbacks, port: { name: http } } } }
